name: Terraform Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
    

concurrency:
  group: deploy-${{ github.repository }}-terraform
  cancel-in-progress: true

jobs:
  get-ssm-parameter:
    runs-on: ubuntu-latest
    steps:
      - name: Get parameter
        run: |
          OIDC_IMAGE_TAG=$(aws ssm get-parameter \
            --name "/OIDC/image_tag" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          echo "OIDC_IMAGE_TAG=$OIDC_IMAGE_TAG" >> $GITHUB_ENV


  terraform-plan-apply:
    needs: get-ssm-parameter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./infra

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Configure AWS credentials
       uses: aws-actions/configure-aws-credentials@v5.1.1
       with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

     - name: Set up Terraform
       uses: hashicorp/setup-terraform@v4
       with:
          terraform_version: 1.15.7
     
     - name: Terraform Init
       run: terraform init

     - name: terraform validate
       run: terraform validate

     - name: tflint
       uses: terraform-linters/setup-tflint@v6
       with:
         tflint_version: 0.52.0
         continue-on-error: true
         cache: true


     - name: Init TFLint
       run: tflint --init
       env:
          GITHUB_TOKEN: ${{ github.token }}
     
     - name: run tflint
       run: tflint -f compact

     - name: checkov scan
       uses: bridgecrewio/checkov-action@v12
       with:
         directory: ./infra
         framework: terraform
         severity-threshold: medium
         soft_fail: true
      
     - name: Terraform Plan
       id: plan
       run: terraform plan -out=tfplan -var="image_tag=$OIDC_IMAGE_TAG"
     - name: Terraform Apply
       run: terraform apply -auto-approve tfplan
